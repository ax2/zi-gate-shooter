<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截击炮架 · 候选对位</title>
<style>body{margin:0;background:#0a1119;color:#dceaf1;font:14px system-ui}main{max-width:720px;margin:auto;padding:16px}h1{font-size:22px}p{line-height:1.6}canvas{width:100%;height:auto;background:#25303a}button{padding:10px;margin:4px;background:#163542;color:white;border:1px solid #547b87}output{display:block;white-space:pre-wrap}</style>
<main><h1>截击炮架 · 候选对位</h1><p>仅检查原创候选的三帧、实体炮口和实际渲染尺寸。未接入游戏；不代表自然战斗、碰撞或难度验收。十字为现有真实出弹锚点，不是射击轨迹。</p><button id="anchors">隐藏锚点</button><button id="animate">暂停三帧轮换</button><canvas width="720" height="650"></canvas><output></output></main>
<script type="module">
const c=document.querySelector('canvas').getContext('2d'),image=new Image(),old=new Image();let anchors=true,animate=true,frame=0;
image.src='/build/art/Stage-250/interceptor-packed-v2.png';old.src='/assets/elite-v1.png';await Promise.all([image.decode(),old.decode()]);
function sprite(img,f,x,y,w=198.24,h=184.96){const cell=img.width/3;c.drawImage(img,cell*f,0,cell,img.height,x-w/2,y-h/2,w,h);}
function draw(){c.fillStyle='#25303a';c.fillRect(0,0,720,650);c.fillStyle='#dceaf1';c.font='18px system-ui';c.fillText('当前共用精英',55,32);c.fillText('新三炮悬浮架候选',380,32);sprite(old,frame,160,155);sprite(image,frame,520,155);
 if(anchors){for(const center of[160,520])for(const dx of[-52,0,52]){c.strokeStyle='#8af6ff';c.lineWidth=1;c.beginPath();c.moveTo(center+dx-6,223);c.lineTo(center+dx+6,223);c.moveTo(center+dx,217);c.lineTo(center+dx,229);c.stroke();}}
 c.fillText('三帧并排（均为游戏尺寸）',30,305);for(let i=0;i<3;i++)sprite(image,i,120+i*240,425);
 document.querySelector('output').textContent=`帧 ${frame+1}/3 · 实际绘制198.24×184.96 · 出弹 x±52 / y+68\n源图仅技术平移排版；无涂改、无规则变化。`;
}
document.querySelector('#anchors').onclick=e=>{anchors=!anchors;e.target.textContent=anchors?'隐藏锚点':'显示锚点';draw();};document.querySelector('#animate').onclick=e=>{animate=!animate;e.target.textContent=animate?'暂停三帧轮换':'继续三帧轮换';};
setInterval(()=>{if(animate)frame=(frame+1)%3;draw();},450);draw();
</script></html>
