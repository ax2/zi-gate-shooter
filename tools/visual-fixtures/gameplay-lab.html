<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Stage-32 武器与敌人机制对比</title></head><body style="margin:0;background:#0a1119;color:#d8eaf5;font:12px sans-serif;overflow:hidden">
<header style="height:68px;text-align:center;box-sizing:border-box;padding:5px">章节/武器对比夹具 · 非完整自然局验收<br>
<select id="scenario" aria-label="对比内容"><option value="contract-reward">契约完成奖励选择</option><option value="rig">叠加机甲挂载检查</option><option value="boss-pressure">首领强度与真实弹幕</option><option value="refinement">满树后的持续精调</option><option value="prism">棱镜组合冻结帧</option><option value="boss-reward">首领奖励与解锁</option><option value="evolved">进化组合（12次突破）</option><option value="support">激光折射组合</option><option value="stacked">叠加火力与参数</option><option value="overload">超载拾取反馈</option><option value="weapon-pickup">换装用法提示</option><option value="combat" selected>预置战斗</option><option value="blast-pack">密集敌群</option><option value="guard">盾卫</option><option value="sniper">狙击哨机</option><option value="defeat">箱体碰撞结算</option><option value="opening">章节开场T1</option><option value="flanker">双翼首领</option><option value="blockade">首领缺口封锁</option><option value="gate-danger">敌弹与门重叠</option><option value="gates">双门奖励排版</option><option value="choices-entry">武器箱入场文字</option><option value="choices">武器箱文字检查</option></select>
<select id="weapon" aria-label="武器"><option value="pulse">速射炮</option><option value="scatter">霰射炮</option><option value="pierce">穿甲炮</option><option value="blast">爆裂炮</option><option value="arc">电弧炮</option></select>
<select id="tier" aria-label="阶数"><option value="1">T1</option><option value="2">T2</option><option value="3" selected>T3</option></select>
<select id="sector" aria-label="章节"><option value="1">突围走廊</option><option value="2">侧翼夹击</option><option value="3">重装封锁</option></select>
<select id="effects" aria-label="特效档"><option value="standard">标准</option><option value="weak">弱化</option></select>
<button id="start">运行对比</button><button id="pause">暂停对比</button></header>
<canvas style="position:fixed;top:68px;width:100vw;height:calc(100vh - 68px);touch-action:none"></canvas>
<script type="module" src="/tools/visual-fixtures/gameplay-lab.js"></script></body></html>
